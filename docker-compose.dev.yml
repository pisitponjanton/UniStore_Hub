name: unistore-hub-dev

x-backend-env: &backend-env
  NODE_ENV: development
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  S3_BROWSER_ENDPOINT_URL: http://localhost:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  APP_TABLE_NAME: unistore-hub-dev-local
  FILES_BUCKET_NAME: unistore-hub-files-local
  NOTIFICATION_QUEUE_URL: http://localstack:4566/000000000000/unistore-hub-notifications-local
  JWT_SECRET: dev-only-secret-change-me
  JWT_EXPIRES_IN: 1d
  CORS_ALLOWED_ORIGINS: http://localhost:3000

services:
  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: dynamodb,s3,sqs
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
      DEBUG: "${LOCALSTACK_DEBUG:-0}"
    volumes:
      - "./scripts/dev/.state/localstack:/var/lib/localstack"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:4566/_localstack/health >/dev/null || exit 1
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  bootstrap:
    image: localstack/localstack:3.8.1
    entrypoint:
      - /bin/bash
      - /workspace/scripts/dev/compose-bootstrap.sh
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      APP_TABLE_NAME: unistore-hub-dev-local
      FILES_BUCKET_NAME: unistore-hub-files-local
      NOTIFICATION_QUEUE_NAME: unistore-hub-notifications-local
    volumes:
      - "./scripts/dev:/workspace/scripts/dev:ro"
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *backend-env
    command:
      - npm
      - run
      - dev:seed
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *backend-env
      PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - "./backend/src:/app/src"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *backend-env
    command:
      - node
      - --watch
      - src/local-worker.js
    volumes:
      - "./backend/src:/app/src"
    depends_on:
      seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - "./frontend/src:/app/src"
      - "./frontend/public:/app/public"
      - "./frontend/next.config.ts:/app/next.config.ts:ro"
      - "./frontend/tsconfig.json:/app/tsconfig.json:ro"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
